<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Hanif CLI — Personal productivity CLI for daily developer workflows">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0d12"/>
      <stop offset="100%" stop-color="#1a1438"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6d4cff"/>
      <stop offset="100%" stop-color="#00d4b4"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.85" cy="0.15" r="0.5">
      <stop offset="0%" stop-color="#6d4cff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#6d4cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="0.95" r="0.5">
      <stop offset="0%" stop-color="#00d4b4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00d4b4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Logo -->
  <g transform="translate(80,80)">
    <rect width="96" height="96" rx="22" fill="url(#brand)"/>
    <g fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="28,38 42,50 28,62"/>
      <line x1="48" y1="64" x2="70" y2="64"/>
    </g>
  </g>

  <text x="200" y="155" fill="#eef0f6" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-1">Hanif CLI</text>
  <text x="200" y="195" fill="#b6bcca" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="22">Personal productivity CLI · git, squash, bumpversion, env, gsetup</text>

  <!-- Headline -->
  <text x="80" y="320" fill="#ffffff" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="-2">Ship faster from</text>
  <text x="80" y="400" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="-2" fill="url(#brand)">your terminal.</text>

  <!-- Terminal preview -->
  <g transform="translate(80,460)">
    <rect width="1040" height="100" rx="14" fill="#07091a" stroke="#232838"/>
    <circle cx="24" cy="24" r="6" fill="#ff5f57"/>
    <circle cx="44" cy="24" r="6" fill="#febc2e"/>
    <circle cx="64" cy="24" r="6" fill="#28c840"/>
    <text x="24" y="78" fill="#eef0f6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22">
      <tspan fill="#00d4b4">$</tspan>
      <tspan fill="#eef0f6"> curl -fsSL hanif-mianjee.github.io/hanif-cli-tools/install.sh | bash</tspan>
    </text>
  </g>
</svg>
